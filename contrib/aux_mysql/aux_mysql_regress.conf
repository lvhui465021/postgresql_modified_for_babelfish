# aux_mysql's _PG_init() (aux_mysql_init.c) hard-requires mysql_parser to
# already be preloaded -- it registers the MySQL ProtocolRoutine using
# mysql_parser's already-registered ParserRoutine, and errors out otherwise.
# That guard fires the moment aux_mysql.so is dlopen'd for any reason, not
# just via shared_preload_libraries: CREATE FUNCTION ... LANGUAGE C always
# loads the library immediately to validate the symbol (fmgr_c_validator),
# so any SQL script that creates a C-backed function -- e.g. the
# mysql.show_warnings() added in aux_mysql--1.5--1.6.sql -- forces this the
# moment ALTER EXTENSION runs it. Real deployments always preload all three
# together; mirror that here instead of testing a combination aux_mysql was
# never designed to support standalone.
shared_preload_libraries = 'mysql_parser, mysm, aux_mysql'
